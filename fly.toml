app = "birthub-360-crm"
primary_region = "sao"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[deploy]
  strategy = "canary"

[[services]]
  internal_port = 3000
  protocol = "tcp"

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    restart_limit = 0

[[services]]
  internal_port = 3000
  protocol = "tcp"

  [[services.ports]]
    port = 8080
    handlers = ["http"]

[vm]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048

[[metrics]]
  port = 3000
  path = "/metrics"
