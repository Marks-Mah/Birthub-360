version: '3.8'

services:
  app:
    image: birthhub-360:latest
    container_name: birthhub-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Variáveis de ambiente devem ser configuradas no arquivo .env
      # ou passadas diretamente aqui
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
