name: Build iOS App

on:
  # Mobile é artefato sob demanda. O gate automático canônico vive em ci.yml.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: iOS / quality gate
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Run Type Check
      run: npx tsc --noEmit

    - name: Run Lint
      run: npm run lint:ci

    - name: Run Unit Tests
      run: npm run test:unit

  ios-build:
    name: iOS / archive
    runs-on: macos-latest
    needs: gate

    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build Web App
      run: npm run build

    - name: Sync Capacitor
      run: npx cap sync ios

    - name: Build iOS App (Archive)
      working-directory: ./ios/App
      run: |
        xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' archive -archivePath "$PWD/build/App.xcarchive" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

    - name: Upload iOS Archive
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: birthhub360-ios-xcarchive
        path: ios/App/build/App.xcarchive
